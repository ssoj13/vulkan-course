name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: only the deploy job may write Pages.
permissions:
  contents: read

# One Pages deployment at a time; never cancel one that is already running.
concurrency:
  group: pages
  cancel-in-progress: false

# Actions are pinned by full commit SHA (a tag can be moved); the comment names the release.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - name: Install site dependencies
        run: bun install --frozen-lockfile
      - name: JS tests (object model, VUID data, interface texts)
        run: bun test tests
      - name: Lesson content lint (quiz model, section links, every language)
        run: bun run lint

  examples-rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/rust
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # ash loads the Vulkan loader at runtime, so building and linting need no SDK or GPU.
      - name: Clippy (warnings are errors)
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Format
        run: cargo fmt --check

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install, build and upload the site
        uses: withastro/action@3eafd002e65cc31b4f0eae0bb05450d521562247 # v6.1.3
        with:
          package-manager: bun@1.4.3

  deploy:
    needs: [test, examples-rust, build]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
